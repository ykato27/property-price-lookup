[project]
name = "property-price-lookup"
version = "0.1.0"
description = "不動産割安物件発見システム"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",
]

# このプロジェクトは配布用パッケージではなく、リポジトリルートから
# `uv run streamlit run app.py` で起動するアプリケーション。
# そのためプロジェクト自身のビルド（wheel）は行わず、依存解決のみを uv に任せる。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
]

# テストはリポジトリルートを基準に `src` / `config` を import する
[tool.pytest.ini_options]
pythonpath = ["."]
